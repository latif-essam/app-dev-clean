version: 2
project_name: app-dev-clean

before:
  hooks:
    - go mod tidy

builds:
  - id: app-dev-clean
    main: .
    binary: app-dev-clean
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"

# The project tap distributes release binaries and installs the adc alias.
brews:
  - repository:
      owner: latif-essam
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: Latif Essam
      email: 50233674+latif-essam@users.noreply.github.com
    homepage: "https://github.com/latif-essam/app-dev-clean"
    description: "Cross-platform dev-cache cleaner (RN/Expo/Flutter/native)"
    license: "MIT"
    dependencies:
      - name: git
    install: |
      bin.install "app-dev-clean"
      bin.install_symlink "app-dev-clean" => "adc"

scoops:
  - repository:
      owner: latif-essam
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: Latif Essam
      email: 50233674+latif-essam@users.noreply.github.com
    homepage: "https://github.com/latif-essam/app-dev-clean"
    description: "Cross-platform dev-cache cleaner (RN/Expo/Flutter/native)"
    license: "MIT"
    depends: ["git"]
    # Alias creation is optional; a failed shim must not block installation.
    post_install:
      - '$shims = if ($env:SCOOP) { "$env:SCOOP\shims" } else { "$env:USERPROFILE\scoop\shims" }'
      - 'if (Test-Path $shims) { Set-Content -Path "$shims\adc.cmd" -Value "@`"$dir\app-dev-clean.exe`" %*" -Encoding ASCII -ErrorAction SilentlyContinue }'

release:
  github:
    owner: latif-essam
    name: app-dev-clean
